name: Train Indonesian Gemma GGUF

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Jumlah epoch fine-tuning"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: write

concurrency:
  group: gemma-indonesian-training
  cancel-in-progress: false

jobs:
  train-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BASE_MODEL: google/gemma-3-270m-it
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRAIN_EPOCHS: ${{ inputs.epochs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required Hugging Face access
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing HF_TOKEN. Accept the Gemma terms on Hugging Face and add HF_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fine-tune LoRA adapter on CPU
        run: python scripts/train.py

      - name: Merge adapter and export GGUF Q8_0
        run: bash scripts/export_gguf.sh

      - name: Upload GGUF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemma-3-270m-indonesian-Q8_0
          path: output/gguf/*.Q8_0.gguf
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="indonesian-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" output/gguf/*.Q8_0.gguf \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gemma 3 270M Indonesian Q8_0 - ${TAG}" \
            --notes "Automated CPU LoRA fine-tune and GGUF Q8_0 export. Model quality and file size have not been independently validated."
